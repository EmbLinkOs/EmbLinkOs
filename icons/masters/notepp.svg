<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD466"/>
      <stop offset="1" stop-color="#F0A526"/>
    </linearGradient>
  </defs>
  <!-- The tile. A rounded square is what makes a symbol read as an APPLICATION
       rather than as a piece of punctuation: at dock size the silhouette is
       most of what anyone actually sees. -->
  <rect x="4" y="4" width="56" height="56" rx="13" ry="13" fill="url(#g)"/>
  <rect x="4" y="4" width="56" height="56" rx="13" ry="13" fill="none"
        stroke="#000" stroke-opacity="0.16" stroke-width="1"/>
  <!-- The glyph, in the 960-unit grid Material Symbols are authored in, scaled
       into the tile and centred. White on colour, because a two-tone icon at
       16px is one muddy tone. -->
  <g transform="translate(15.0 49.0) scale(0.035417)" fill="#fff">
    <path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l240 240v480q0 33-23.5 56.5T720-80H240Zm280-520v-200H240v640h480v-440H520Z"/>
  </g>
</svg>
